{% extends "base.html" %}

{% block content %}
<div class="card shadow">
    <div class="card-header bg-white">
        <h3 class="card-title mb-0"><i class="fas fa-edit me-2"></i>Update Asset</h3>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Asset Name</label>
                    <input type="text" name="name" class="form-control" value="{{ asset.name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Asset Type</label>
                    <input type="text" name="type" class="form-control" value="{{ asset.type }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" class="form-control" value="{{ asset.location }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Serial Number</label>
                    <input type="text" name="serial_no" class="form-control" value="{{ asset.serial_no }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Assigned To</label>
                    <input type="text" name="assigned_to" class="form-control" value="{{ asset.assigned_to }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select" required>
                        <option value="Active" {% if asset.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="In Repair" {% if asset.status == 'In Repair' %}selected{% endif %}>In Repair</option>
                        <option value="Retired" {% if asset.status == 'Retired' %}selected{% endif %}>Retired</option>
                    </select>
                </div>
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary px-4 py-2">
                        <i class="fas fa-save me-2"></i>Update Asset
                    </button>
                    <a href="{{ url_for('view_assets') }}" class="btn btn-outline-secondary ms-2">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
